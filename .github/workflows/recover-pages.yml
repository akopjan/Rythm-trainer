name: Publish verified rhythm trainer
on:
  push:
    branches: [codex/recover-pages-v30]
permissions:
  pages: write
jobs:
  request-verified-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read current Pages state and request the latest main build
        env:
          PAGES_RECOVERY_TOKEN: ${{ github.token }}
          PAGES_API_URL: https://api.github.com/repos/akopjan/Rythm-trainer/pages
        run: |
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${PAGES_RECOVERY_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "${PAGES_API_URL}" --output /tmp/rhythm-pages-config.json
          python3 -c 'import json; d=json.load(open("/tmp/rhythm-pages-config.json")); print("::notice title=Pages configuration::"+json.dumps({k:d.get(k) for k in ["status","build_type","source","html_url"]}))'
          curl --fail-with-body --silent --show-error --location --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${PAGES_RECOVERY_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "${PAGES_API_URL}/builds" --output /tmp/rhythm-pages-request.json
          python3 -c 'import json; print("::notice title=Pages build request::"+json.dumps(json.load(open("/tmp/rhythm-pages-request.json"))))'
